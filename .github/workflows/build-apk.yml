name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Active Java version string: $JAVA_VERSION_STR"

          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "Error: Could not detect active Java version string."
            exit 1
          fi

          JAVA_MAJOR=$(echo "$JAVA_VERSION_STR" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Active Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not parse numeric Java major version."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Detected version: $JAVA_MAJOR"
            exit 1
          fi

          echo "Java environment verified successfully: Java $JAVA_MAJOR >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            "$JAVA_HOME/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi

          echo "Temporary debug keystore verified successfully at ./debug.keystore."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for available APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: $EXPECTED_APK does not have a .apk extension."
            exit 1
          fi

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Verified debug APK exists and is valid: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR=$(mktemp -d -t apk-asset-XXXXXX)
          COPIED_ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$COPIED_ASSET_PATH"

          if [ ! -f "$COPIED_ASSET_PATH" ] || [ ! -s "$COPIED_ASSET_PATH" ]; then
            echo "Error: Release asset preparation failed or asset is empty."
            exit 1
          fi

          echo "Prepared release asset: $COPIED_ASSET_PATH"
          echo "Asset filename: $ASSET_FILENAME"
          echo "asset_path=$COPIED_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI Availability ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_release_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is empty: $ASSET_PATH"
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Release asset does not have .apk extension: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          ### Debug APK Build #${GITHUB_RUN_NUMBER}
          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Intended Use:** Testing and QA verification
          - **Production Notice:** This APK is not a Play Store production release.
          - **Signing:** Signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG and asset: $ASSET_PATH"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Reporting APK Download Result ==="
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release publishing succeeded."
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Debug APK Released Successfully
          - **Release Tag:** \`$RELEASE_TAG\`
          - **Release Title:** $RELEASE_TITLE
          - **Direct Release Page:** [$RELEASE_URL]($RELEASE_URL)
          - **APK Asset Filename:** \`$ASSET_NAME\`

          📱 **Download Instructions (Phone & Desktop):**
          1. Open the [Release Page]($RELEASE_URL).
          2. Download the APK file (\`$ASSET_NAME\`) directly from the **Assets** section.
          3. Install and test on your Android device.

          📦 **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available at the bottom of this workflow run page.
          EOF
          else
            echo "WARNING: GitHub Release publishing could not be completed (Outcome: ${{ steps.publish_release.outcome }})."
            echo "The debug APK build and Actions artifact upload succeeded."
            echo "The Actions artifact named 'app-debug-apk' remains available for download."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### ⚠️ GitHub Release Notice
          - **APK Build:** ✅ Succeeded
          - **Actions Artifact:** ✅ \`app-debug-apk\` is available for download
          - **GitHub Release:** ⚠️ Release publishing step was not completed (check token permissions or runner logs)

          📦 **Backup Download:**
          You can download the compiled APK from the **Artifacts** section at the bottom of this workflow run page under the name \`app-debug-apk\`.
          EOF
          fi
